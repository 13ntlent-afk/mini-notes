server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mininotes}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by the hand-written DDL scripts, not by Hibernate or Flyway.
      ddl-auto: none
    properties:
      hibernate.default_schema: ${DB_SCHEMA:public}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    key-id: ${JWT_KID:}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    allow-ephemeral-key: false