<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${note.title} + ' | Mini Notes'">Mini Notes</title>
  <style>
    body { max-width: 760px; margin: 48px auto; padding: 0 24px; color: #242a27; font: 16px/1.7 Georgia, serif; }
    h1 { border-bottom: 1px solid #d8d8d0; padding-bottom: 16px; font-size: 32px; }
    .date { color: #757b74; font: 12px Arial, sans-serif; }
    .body { white-space: pre-wrap; overflow-wrap: anywhere; }
    @media print { body { margin: 0; } }
  </style>
</head>
<body>
  <p class="date" th:text="${note.updatedAt}">Date</p>
  <h1 th:text="${note.title}">Note title</h1>
  <div class="body" th:text="${note.body}">Note body</div>
</body>
</html>
