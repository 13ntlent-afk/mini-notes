server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: notes-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mininotes}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by the hand-written DDL scripts, not by Hibernate or Flyway.
      ddl-auto: none
    properties:
      hibernate.default_schema: ${DB_SCHEMA:public}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  security:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}