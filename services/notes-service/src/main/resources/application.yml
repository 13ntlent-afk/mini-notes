server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: notes-service
  datasource:
    url: ${SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mininotes} 
    username: ${SPRING_DATASOURCE_USERNAME: postgres}
    password: ${SPRING_DATASOURCE_PASSWORD: }
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: ${DB_SCHEMA:notes}
  flyway:
    default-schema: ${DB_SCHEMA:notes}
    schemas: ${DB_SCHEMA:notes}
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  security:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}