server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: gateway
  webflux:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
management:
  endpoints:
    web:
      exposure:
        include: health,info