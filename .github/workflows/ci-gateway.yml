name: Gateway CI
on:
  push:
    paths: ["services/gateway/**", "platform/bom/**", "pom.xml", ".github/workflows/ci-gateway.yml"]
  pull_request:
    paths: ["services/gateway/**", "platform/bom/**", "pom.xml", ".github/workflows/ci-gateway.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -pl services/gateway -am verify