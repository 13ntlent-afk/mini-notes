name: Contact Service CI
on:
  push:
    paths: ["services/contact-service/**", "platform/bom/**", "pom.xml", ".github/workflows/ci-contact-service.yml"]
  pull_request:
    paths: ["services/contact-service/**", "platform/bom/**", "pom.xml", ".github/workflows/ci-contact-service.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -pl services/contact-service -am verify