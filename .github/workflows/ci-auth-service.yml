name: Auth Service CI
on:
  push:
    paths: ["services/auth-service/**", "platform/bom/**", "pom.xml", ".github/workflows/ci-auth-service.yml"]
  pull_request:
    paths: ["services/auth-service/**", "platform/bom/**", "pom.xml", ".github/workflows/ci-auth-service.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -pl services/auth-service -am verify