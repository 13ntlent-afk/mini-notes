server {
    listen 80;
    server_name _;

    location /api/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://gateway:8080;
    }

    location /bff/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://gateway:8080;
    }

    location /print/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://gateway:8080;
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://web:8080;
    }
}