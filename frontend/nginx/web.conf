server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /app/;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        expires -1;
    }

    location ~* ^/app/assets/.+\.(?:js|css|woff2?|svg|png|jpg|webp)$ {
        rewrite ^/app/(.*)$ /$1 break;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location /app/ {
        rewrite ^/app/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        return 404;
    }
}