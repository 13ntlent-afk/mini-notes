openapi: 3.1.0
info:
  title: Mini Notes API
  version: 0.1.0
servers:
  - url: /
paths:
  /api/notes:
    get:
      summary: List notes
      responses:
        '200':
          description: Notes ordered by most recently updated
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NoteResponse' }
    post:
      summary: Create a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
      responses:
        '201':
          description: Note created
        '400':
          description: Invalid note
        '401':
          description: Authentication required
  /api/notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read an owned note
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Note
        '404':
          description: Note not found
    put:
      summary: Update a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
      responses:
        '200':
          description: Note updated
        '404':
          description: Note not found
    delete:
      summary: Delete a note
      responses:
        '204':
          description: Note deleted
        '404':
          description: Note not found
  /print/{id}:
    get:
      summary: Render an owned note as a printable HTML page
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Printable HTML document
          content:
            text/html:
              schema: { type: string }
        '404':
          description: Note not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    NoteRequest:
      type: object
      additionalProperties: false
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        body: { type: string, maxLength: 20000 }
    NoteResponse:
      type: object
      required: [id, title, body, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }